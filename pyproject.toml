[project]
name = "mader"
version = "0.1.0"
description = ""
authors = [
    {name = "manoel cândido",email = "candidomanoel78@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.16.8,<0.17.0)",
    "typos (>=1.50.2,<2.0.0)",
    "httpx2 (>=2.13.0,<3.0.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']
ignore = ['W191']

[tool.ruff.format]
preview = true
quote-style = 'single'
indent-style = 'tab'

[tool.pytest]
pythonpath = ['.']
addopts = ['-p', 'no:warnings', '--cov=mader', '--cov-context=test']

[tool.typos.files]
extend-exclude = ["*.md", "migrations"]

[tool.poe] 
poetry_command = ""

[tool.poe.tasks]
lint.sequence = [
  { cmd = "typos" }, 
  { cmd = "ruff check" },
]
format.sequence = [
  { cmd = "ruff check --fix" },
  { cmd = "ruff format" },
]
serve = "fastapi dev fast_zero/app.py"
test.sequence = [
  "lint",
  { cmd = "pytest -s -x -vv $POE_EXTRA_ARGS" },
  { cmd = "coverage html --show-contexts" },
]